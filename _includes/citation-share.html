<!-- Citation code generated by Claude -->
<section id="cite-this-blog" style="margin-top: 1.5em;">>
    Cite this post:
    <!-- Hidden div with processed template variables -->
    <div id="bibtex-data" 
            data-title="{{ page.title }}"
            data-author="{{ site.author.name }}"
            data-journal="{{ site.url }}"
            data-date="{{ page.date }}"
            data-url="{{ page.permalink }}"
            style="display: none;"></div>

    <!-- Empty div that will hold the highlight block -->
    <div id="bibtex-highlight-container" class="citation-block"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        // Get data from hidden div (processed by template engine)
        const dataDiv = document.getElementById('bibtex-data');
        if (!dataDiv) return;
        
        const title = dataDiv.getAttribute('data-title');
        const author = dataDiv.getAttribute('data-author');
        const journal = dataDiv.getAttribute('data-journal');
        const date = dataDiv.getAttribute('data-date');
        const url = dataDiv.getAttribute('data-url');
        
        // Format date properly
        const dateObj = new Date(date);
        const year = dateObj.getFullYear().toString();
        const monthNames = ["January", "February", "March", "April", "May", "June",
                            "July", "August", "September", "October", "November", "December"];
        const monthAbbrs = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", 
                            "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const fullMonth = monthNames[dateObj.getMonth()];
        const abbrMonth = monthAbbrs[dateObj.getMonth()];
        
        // Create citation key
        const authorNoSpaces = author.replace(/\s+/g, "");
        const titleNoSpaces = title.replace(/\s+/g, "_");
        const dateSuffix = `${year}${abbrMonth}`;
        const citationKey = `${authorNoSpaces}_${titleNoSpaces}_${dateSuffix}`;
        
        // Create BibTeX content
        const bibtexContent = `@article{${citationKey},
title = {${title}},
author = {${author}},
journal = {${journal}},
year = {${year}},
month = {${fullMonth}},
url = {${journal}${url}},
}`;
        
        // Create a pre element with the correct classes for syntax highlighting
        const container = document.getElementById('bibtex-highlight-container');
        if (container) {
            const pre = document.createElement('pre');
            pre.className = 'highlight language-latex'; // Adjust classes based on your styling
            
            const code = document.createElement('code');
            code.className = 'language-latex';
            code.textContent = bibtexContent;
            
            pre.appendChild(code);
            container.appendChild(pre);

            //Trigger Prism to highlight newly added content
            Prism.highlightElement(code);
        }
        });
    </script>
